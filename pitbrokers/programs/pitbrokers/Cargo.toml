[package]
name = "pitbrokers"
version = "0.1.0"
description = "PitBrokers mint / sell-back program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pitbrokers"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
# The `anchor` feature pins mpl-core to solana-program 2.x + anchor-lang 0.31,
# matching anchor-lang above. Without it, cargo resolves two incompatible
# solana-program versions (2.3 and 3.0) and every AccountInfo passed into a
# CpiBuilder fails to typecheck.
# `default-features = false` is required, not tidiness: mpl-core's default
# `borsh-v1` feature and its `anchor` feature are mutually exclusive (kaigan
# emits a compile_error!) because Anchor uses borsh 0.10 internally.
mpl-core = { version = "0.12.1", default-features = false, features = ["anchor"] }
