[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
pitbrokers = "AZxi6H7EcVRo23zyVmET74m8mPWBGKkPaexsdMq68MNU"

[programs.localnet]
pitbrokers = "AZxi6H7EcVRo23zyVmET74m8mPWBGKkPaexsdMq68MNU"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Metaplex Core, cloned into the local validator so `anchor test` can exercise
# the real CPI rather than a mock.
[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
